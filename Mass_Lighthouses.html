<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Massachusetts Lighthouses Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        z-index: 1; 
      }
      #title {
        position: absolute;
        top: 20px;
        left: 20px; 
        font-size: 24px;
        font-weight: bold; 
        color: #222; 
        z-index: 2; 
      }
      #legend {
        position: absolute;
        top: 10px;
        right: 10px; 
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        font-size: 14px;
        border-radius: 5px;
        z-index: 2; 
      }
    </style>
  </head>
  <body>

    <div id="title">Massachusetts Lighthouses</div>

    <div id="legend">
      <p>Click on a lighthouse to see its location.</p>
    </div>

    <div id="map"></div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
    <script>
      
      mapboxgl.accessToken = 'pk.eyJ1Ijoiam5ob29kIiwiYSI6ImNtbmYxcGpncDA1dWMycXExMnNjaGp0MHkifQ.eXVB3Yk6_7Q3VHrS2NDfDg';

      const map = new mapboxgl.Map({
        container: 'map',  
        style: 'mapbox://styles/jnhood/cmnhr6fgb001z01p10k05abme',  
        center: [-70.6, 42.1],       
	zoom: 7.8 
	});

     
      map.on('load', function () {
    
        map.on('click', function (e) {
        
          const features = map.queryRenderedFeatures(e.point, { layers: ['Lighthouses_markers'] });

          if (features.length > 0) {
            const feature = features[0]; 

            console.log('Feature properties:', feature.properties);

            const name = feature.properties.NAME; 
            const location = feature.properties.LOCATION;

            console.log('Location:', location);

            if (location) {
              const popup = new mapboxgl.Popup({ offset: [0, -15] })
                .setLngLat(feature.geometry.coordinates)  
                .setHTML(`
                  <h3>${name}</h3>
                  <p><strong>Location:</strong> ${location}</p>
                `)
                .addTo(map);
            } else {
              console.log('No location data available for this lighthouse.');
            }
          } else {
            console.log('No lighthouse clicked or feature not found.');
          }
        });
      });
    </script>
  </body>
</html>
